[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dictionary-ingestion"
version = "0.1.0"
description = "PDF dictionary ingestion pipeline with OpenAI embeddings and Supabase pgvector search API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "openai>=1.30",
  "pgvector>=0.2.5",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "pypdf>=4.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dictionary-ingest = "dictionary_ingestion.ingest:main"
dictionary-api = "dictionary_ingestion.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
